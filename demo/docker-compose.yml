# Demo target system. Total memory limits ~1.2GB.
# recovery.depends_on labels give the agent the service dependency graph.
name: demo

x-app: &app
  build: ./app
  restart: "no"

services:
  api:
    <<: *app
    ports: ["8000:8000"]
    volumes: ["./config/api:/config"]       # per-service config: a rollback never touches another service
    mem_limit: 256m
    tmpfs: ["/data:size=16m"]
    labels:
      recovery.depends_on: "db,cache"
      recovery.metrics_url: "http://localhost:8000/metrics"
      recovery.config_path: "/config/app.env"
      recovery.scratch_path: "/data/tmp"
    depends_on: {db: {condition: service_healthy}, cache: {condition: service_started}}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 2

  worker:
    <<: *app
    command: ["python", "worker.py"]
    volumes: ["./config/worker:/config"]
    mem_limit: 256m
    labels: {recovery.depends_on: "db,cache", recovery.config_path: "/config/app.env"}
    depends_on: {db: {condition: service_healthy}, cache: {condition: service_started}}

  db:
    image: postgres:16-alpine
    command: ["postgres", "-c", "max_connections=30"]
    environment: {POSTGRES_DB: app, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres}
    volumes: ["./db-init.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
    mem_limit: 512m
    labels:
      recovery.depends_on: ""
      recovery.stateful: "true"   # disruptive actions (restart, scale) on it are high risk
      # connection-usage probe (percent of max_connections), used by verify's fault-specific check
      recovery.conn_usage_cmd: >-
        psql -U postgres -d app -tAc "SELECT round(100.0 * count(*) / current_setting('max_connections')::int)
        FROM pg_stat_activity WHERE backend_type='client backend'"
      # kill_idle_connections hook; runs as superuser via the reserved slots
      recovery.kill_idle_cmd: >-
        psql -U postgres -d app -tAc "SELECT count(pg_terminate_backend(pid)) FROM pg_stat_activity
        WHERE backend_type='client backend' AND state IN ('idle','idle in transaction')
        AND now() - state_change > interval '10 seconds' AND usename <> 'postgres'"
    healthcheck:
      # a real login as the app role, so connection exhaustion makes the db unhealthy
      test: ["CMD", "psql", "-U", "app", "-d", "app", "-tAc", "select 1"]
      interval: 3s
      timeout: 3s
      retries: 2

  cache:
    image: redis:7-alpine
    mem_limit: 128m
    labels: {recovery.depends_on: ""}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 2

  traffic:
    image: curlimages/curl:8.11.1
    entrypoint: ["sh", "-c", "while true; do curl -s -o /dev/null http://api:8000/work; sleep 0.2; done"]
    mem_limit: 32m
    labels: {recovery.depends_on: "api"}
    depends_on: [api]
